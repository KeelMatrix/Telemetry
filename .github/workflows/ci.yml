name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Invalid release tag '${GITHUB_REF_NAME}'. Expected vX.Y.Z." >&2
              exit 1
            fi
            package_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${package_version}" >> "$GITHUB_OUTPUT"
            echo "Release tag ${GITHUB_REF_NAME} resolved to package version ${package_version}."
            exit 0
          fi

          package_version="$(sed -n 's:^[[:space:]]*<Version>\([^<]*\)</Version>[[:space:]]*$:\1:p' Directory.Build.props | head -n 1)"
          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Directory.Build.props does not define a stable X.Y.Z Version." >&2
            exit 1
          fi
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

  validate:
    if: github.actor != 'dependabot[bot]'
    needs: resolve-version
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx --configfile NuGet.config

      - name: Build
        run: dotnet build KeelMatrix.Telemetry.slnx --configuration Release --no-restore -p:Version=${{ needs.resolve-version.outputs.version }}

      - name: Test unit project
        timeout-minutes: 7
        shell: bash
        run: |
          set -uo pipefail
          results_dir=./artifacts/test-results/unit
          console_log="$results_dir/console.log"
          mkdir -p "$results_dir"

          kill_tree() {
            local pid="$1"
            local signal="$2"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child" "$signal"
            done
            kill -"$signal" "$pid" 2>/dev/null || true
          }

          dotnet test tests/KeelMatrix.Telemetry.UnitTests/KeelMatrix.Telemetry.UnitTests.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ needs.resolve-version.outputs.version }} \
            --results-directory "$results_dir" \
            --logger "trx;LogFileName=unit.trx" \
            --logger "console;verbosity=detailed" \
            --blame-hang \
            --blame-hang-timeout 5m >"$console_log" 2>&1 &
          test_pid=$!
          deadline=$((SECONDS + 390))
          timed_out=0

          while kill -0 "$test_pid" 2>/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::dotnet test exceeded the 390-second in-step deadline; terminating its process tree." | tee -a "$console_log"
              if [[ "${RUNNER_OS}" == "Windows" ]]; then
                taskkill.exe /PID "$test_pid" /T /F >>"$console_log" 2>&1 || true
              else
                kill_tree "$test_pid" TERM
                sleep 2
                kill_tree "$test_pid" KILL
              fi
              timed_out=1
              break
            fi
            sleep 5
          done

          if (( timed_out )); then
            wait "$test_pid" 2>/dev/null || true
            result=124
          elif wait "$test_pid"; then
            result=0
          else
            result=$?
          fi

          cat "$console_log"
          exit "$result"

      - name: Test cross-process queue class (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 7
        shell: bash
        run: |
          set -uo pipefail
          results_dir=./artifacts/test-results/integration-cross-process
          console_log="$results_dir/console.log"
          mkdir -p "$results_dir"

          kill_tree() {
            local pid="$1"
            local signal="$2"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child" "$signal"
            done
            kill -"$signal" "$pid" 2>/dev/null || true
          }

          dotnet test tests/KeelMatrix.Telemetry.IntegrationTests/KeelMatrix.Telemetry.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ needs.resolve-version.outputs.version }} \
            --filter "FullyQualifiedName~KeelMatrix.Telemetry.IntegrationTests.DurableTelemetryQueueIntegrationTests" \
            --results-directory "$results_dir" \
            --logger "trx;LogFileName=integration-cross-process.trx" \
            --logger "console;verbosity=detailed" \
            --blame-hang \
            --blame-hang-timeout 5m >"$console_log" 2>&1 &
          test_pid=$!
          deadline=$((SECONDS + 390))
          timed_out=0

          while kill -0 "$test_pid" 2>/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::dotnet test exceeded the 390-second in-step deadline; terminating its process tree." | tee -a "$console_log"
              if [[ "${RUNNER_OS}" == "Windows" ]]; then
                taskkill.exe /PID "$test_pid" /T /F >>"$console_log" 2>&1 || true
              else
                kill_tree "$test_pid" TERM
                sleep 2
                kill_tree "$test_pid" KILL
              fi
              timed_out=1
              break
            fi
            sleep 5
          done

          if (( timed_out )); then
            wait "$test_pid" 2>/dev/null || true
            result=124
          elif wait "$test_pid"; then
            result=0
          else
            result=$?
          fi

          cat "$console_log"
          exit "$result"

      - name: Test integration project
        timeout-minutes: 7
        shell: bash
        run: |
          set -uo pipefail
          results_dir=./artifacts/test-results/integration
          console_log="$results_dir/console.log"
          mkdir -p "$results_dir"

          kill_tree() {
            local pid="$1"
            local signal="$2"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child" "$signal"
            done
            kill -"$signal" "$pid" 2>/dev/null || true
          }

          test_filter=()
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            test_filter=(--filter "FullyQualifiedName!~KeelMatrix.Telemetry.IntegrationTests.DurableTelemetryQueueIntegrationTests")
          fi

          dotnet test tests/KeelMatrix.Telemetry.IntegrationTests/KeelMatrix.Telemetry.IntegrationTests.csproj \
            "${test_filter[@]}" \
            --configuration Release \
            --no-build \
            -p:Version=${{ needs.resolve-version.outputs.version }} \
            --results-directory "$results_dir" \
            --logger "trx;LogFileName=integration.trx" \
            --logger "console;verbosity=detailed" \
            --blame-hang \
            --blame-hang-timeout 5m >"$console_log" 2>&1 &
          test_pid=$!
          deadline=$((SECONDS + 390))
          timed_out=0

          while kill -0 "$test_pid" 2>/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::dotnet test exceeded the 390-second in-step deadline; terminating its process tree." | tee -a "$console_log"
              if [[ "${RUNNER_OS}" == "Windows" ]]; then
                taskkill.exe /PID "$test_pid" /T /F >>"$console_log" 2>&1 || true
              else
                kill_tree "$test_pid" TERM
                sleep 2
                kill_tree "$test_pid" KILL
              fi
              timed_out=1
              break
            fi
            sleep 5
          done

          if (( timed_out )); then
            wait "$test_pid" 2>/dev/null || true
            result=124
          elif wait "$test_pid"; then
            result=0
          else
            result=$?
          fi

          cat "$console_log"
          exit "$result"

      - name: Test CI environment project
        timeout-minutes: 7
        shell: bash
        run: |
          set -uo pipefail
          results_dir=./artifacts/test-results/ci-environment
          console_log="$results_dir/console.log"
          mkdir -p "$results_dir"

          kill_tree() {
            local pid="$1"
            local signal="$2"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child" "$signal"
            done
            kill -"$signal" "$pid" 2>/dev/null || true
          }

          dotnet test tests/KeelMatrix.Telemetry.CiEnvironmentTests/KeelMatrix.Telemetry.CiEnvironmentTests.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ needs.resolve-version.outputs.version }} \
            --results-directory "$results_dir" \
            --logger "trx;LogFileName=ci-environment.trx" \
            --logger "console;verbosity=detailed" \
            --blame-hang \
            --blame-hang-timeout 5m >"$console_log" 2>&1 &
          test_pid=$!
          deadline=$((SECONDS + 390))
          timed_out=0

          while kill -0 "$test_pid" 2>/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::dotnet test exceeded the 390-second in-step deadline; terminating its process tree." | tee -a "$console_log"
              if [[ "${RUNNER_OS}" == "Windows" ]]; then
                taskkill.exe /PID "$test_pid" /T /F >>"$console_log" 2>&1 || true
              else
                kill_tree "$test_pid" TERM
                sleep 2
                kill_tree "$test_pid" KILL
              fi
              timed_out=1
              break
            fi
            sleep 5
          done

          if (( timed_out )); then
            wait "$test_pid" 2>/dev/null || true
            result=124
          elif wait "$test_pid"; then
            result=0
          else
            result=$?
          fi

          cat "$console_log"
          exit "$result"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            ./artifacts/test-results
            **/TestResults/**
          if-no-files-found: ignore
          overwrite: true

  validate-dependabot:
    if: github.actor == 'dependabot[bot]'
    needs: resolve-version
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx --configfile NuGet.config

      - name: Build
        run: dotnet build KeelMatrix.Telemetry.slnx --configuration Release --no-restore -p:Version=${{ needs.resolve-version.outputs.version }}

      - name: Test
        run: dotnet test KeelMatrix.Telemetry.slnx --configuration Release --no-build -p:Version=${{ needs.resolve-version.outputs.version }}

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - validate
      - validate-dependabot
    if: |
      always() &&
      !cancelled() &&
      (needs.resolve-version.result == 'success') &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.validate-dependabot.result == 'success' || needs.validate-dependabot.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx --configfile NuGet.config

      - name: Build
        run: dotnet build src/KeelMatrix.Telemetry/KeelMatrix.Telemetry.csproj --configuration Release --no-restore -p:Version=${{ needs.resolve-version.outputs.version }}

      - name: Pack release
        if: needs.resolve-version.outputs.is_release == 'true'
        run: dotnet pack src/KeelMatrix.Telemetry/KeelMatrix.Telemetry.csproj --configuration Release --no-build --include-symbols -p:Version=${{ needs.resolve-version.outputs.version }} -p:SymbolPackageFormat=snupkg --output ./artifacts/packages

      - name: Pack
        if: needs.resolve-version.outputs.is_release != 'true'
        run: dotnet pack src/KeelMatrix.Telemetry/KeelMatrix.Telemetry.csproj --configuration Release --no-build --include-symbols -p:Version=${{ needs.resolve-version.outputs.version }} -p:SymbolPackageFormat=snupkg --output ./artifacts/packages

      - name: Validate package artifacts
        shell: pwsh
        run: |
          $arguments = @{
            Version = '${{ needs.resolve-version.outputs.version }}'
            PackageDirectory = './artifacts/packages'
            RunConsumerSmoke = $true
          }
          if ('${{ needs.resolve-version.outputs.is_release }}' -eq 'true') {
            $arguments.Tag = '${{ github.ref_name }}'
            $arguments.RequireFinalizedChangelog = $true
          }
          ./scripts/Validate-Release.ps1 @arguments

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages
          if-no-files-found: error
          overwrite: true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - validate
      - validate-dependabot
    if: |
      always() &&
      !cancelled() &&
      (needs.resolve-version.result == 'success') &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.validate-dependabot.result == 'success' || needs.validate-dependabot.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx --configfile NuGet.config

      - name: Build
        run: dotnet build KeelMatrix.Telemetry.slnx --configuration Release --no-restore -p:Version=${{ needs.resolve-version.outputs.version }}

      - name: Run benchmarks
        shell: pwsh
        run: >
          ./bench/Run-Benchmarks.ps1
          -Job Short
          -Ci
          -CoolDownSec 0
          -Filter "*ClientSignalBench.*" ,"*TelemetrySerializerBench.*" ,"*TelemetryDispatcherBench.*"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-ubuntu-latest
          path: ./artifacts/benchmarks
          if-no-files-found: ignore
          overwrite: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - pack
    if: ${{ always() && needs.resolve-version.result == 'success' && needs.pack.result == 'success' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          ./scripts/Validate-Release.ps1 -Version $version -Tag '${{ github.ref_name }}' -PackageDirectory './artifacts/packages' -RequireFinalizedChangelog -RunConsumerSmoke

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push packages to NuGet
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          dotnet nuget push "./artifacts/packages/KeelMatrix.Telemetry.${package_version}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          dotnet nuget push "./artifacts/packages/KeelMatrix.Telemetry.${package_version}.snupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./artifacts/packages/KeelMatrix.Telemetry.${{ needs.resolve-version.outputs.version }}.nupkg
            ./artifacts/packages/KeelMatrix.Telemetry.${{ needs.resolve-version.outputs.version }}.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
