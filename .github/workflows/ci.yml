name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  validate:
    if: github.actor != 'dependabot[bot]'
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx

      - name: Build
        run: dotnet build KeelMatrix.Telemetry.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test KeelMatrix.Telemetry.slnx --configuration Release --no-build

  validate-dependabot:
    if: github.actor == 'dependabot[bot]'
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx

      - name: Build
        run: dotnet build KeelMatrix.Telemetry.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test KeelMatrix.Telemetry.slnx --configuration Release --no-build

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs:
      - validate
      - validate-dependabot
    if: |
      always() &&
      !cancelled() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.validate-dependabot.result == 'success' || needs.validate-dependabot.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx

      - name: Resolve package version
        id: package_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Invalid release tag '${GITHUB_REF_NAME}'. Expected vX.Y.Z." >&2
            exit 1
          fi

          package_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "Release tag ${GITHUB_REF_NAME} resolved to package version ${package_version}."

      - name: Build
        run: dotnet build src/KeelMatrix.Telemetry/KeelMatrix.Telemetry.csproj --configuration Release --no-restore

      - name: Pack release
        if: steps.package_version.outputs.is_release == 'true'
        run: dotnet pack src/KeelMatrix.Telemetry/KeelMatrix.Telemetry.csproj --configuration Release --no-build --include-symbols -p:Version=${{ steps.package_version.outputs.version }} --p:SymbolPackageFormat=snupkg --output ./artifacts/packages

      - name: Pack
        if: steps.package_version.outputs.is_release != 'true'
        run: dotnet pack src/KeelMatrix.Telemetry/KeelMatrix.Telemetry.csproj --configuration Release --no-build --include-symbols --p:SymbolPackageFormat=snupkg --output ./artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages
          if-no-files-found: error
          overwrite: true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs:
      - validate
      - validate-dependabot
    if: |
      always() &&
      !cancelled() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.validate-dependabot.result == 'success' || needs.validate-dependabot.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Telemetry.slnx

      - name: Build
        run: dotnet build KeelMatrix.Telemetry.slnx --configuration Release --no-restore

      - name: Run benchmarks
        shell: pwsh
        run: >
          ./bench/Run-Benchmarks.ps1
          -Job Short
          -Ci
          -CoolDownSec 0
          -Filter "*ClientSignalBench.*" ,"*TelemetrySerializerBench.*" ,"*TelemetryDispatcherBench.*"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-ubuntu-latest
          path: ./artifacts/benchmarks
          if-no-files-found: ignore
          overwrite: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: pack
    if: ${{ always() && needs.pack.result == 'success' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push packages to NuGet
        run: |
          dotnet nuget push "./artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          dotnet nuget push "./artifacts/packages/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
